<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#6A61AC">
<title>Jess Boyd — Links</title>
<meta name="description" content="Jess Boyd: creative project coordinator and product innovation student. Portfolio, resume, LinkedIn, and email.">
<meta property="og:title" content="Jess Boyd — Links">
<meta property="og:description" content="Project Coordinator. Product Innovation Student. Creative at heart.">
<script>(function () { document.documentElement.classList.add('js'); })();</script>
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<!-- Same design system as the portfolio: base (colors, fonts) + effects (handwriting, stars, scroll-reveal), then this page's own file. -->
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/effects.css">
<link rel="stylesheet" href="../css/links.css">
</head>
<body class="links-page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="2"/></filter>
</svg>

<div class="page">
  <main class="stack" id="main">

    <!-- PHOTO — logo top-left, Polaroid-framed portrait (same photo as the homepage About section) top-right
         with a piece of tape, and the vintage camera doodle peeking from behind the bottom-left corner -->
    <div class="portrait-wrap reveal" style="--d:0">
      <img class="sig" src="../assets/img/signature-logo.png" width="326" height="251" alt="Jess Boyd">
      <img class="camera" src="../assets/img/camera-vintage.png" width="586" height="419" loading="lazy" alt="" aria-hidden="true">
      <figure class="polaroid">
        <img src="../assets/img/photo-portrait.jpg" width="960" height="960" loading="eager" alt="Jess smiling outdoors in a teal top, with green trees blurred behind">
        <span class="tape" aria-hidden="true"></span>
      </figure>
    </div>

    <!-- NAME + ROLE -->
    <div class="idcard reveal" style="--d:1">
      <h1 class="bigname">Jess Boyd</h1>
      <ul class="roles">
        <li>Project Coordinator</li>
        <li>Product Innovation Student</li>
        <li>Creative at Heart</li>
      </ul>
    </div>

    <!-- LINKS — four sticky-note buttons, in this exact order. Edit the destinations below (each is a plain href). -->
    <nav class="linklist" aria-label="Jess’s links">
      <a class="btn btn--portfolio reveal" style="--d:2" href="../">
        <span class="fill" aria-hidden="true"></span>
        <span class="btnnote" aria-hidden="true"><span class="script" data-draw>Check out my</span></span>
        <img class="cstar cstar--a" src="../assets/img/star.png" alt="" aria-hidden="true">
        <span class="btnlabel">Portfolio</span>
      </a>

      <a class="btn btn--resume reveal" style="--d:3" href="../assets/Jess-Boyd-Resume.pdf" download="Jess-Boyd-Resume.pdf">
        <span class="fill" aria-hidden="true"></span>
        <span class="btnlabel">Resume<span class="sr"> (PDF download)</span></span>
        <img class="cstar cstar--b" src="../assets/img/star.png" alt="" aria-hidden="true">
      </a>

      <a class="btn btn--linkedin reveal" style="--d:4" href="https://www.linkedin.com/in/jessica-b-238604137/" target="_blank" rel="noopener noreferrer">
        <img class="cstar cstar--c" src="../assets/img/star.png" alt="" aria-hidden="true">
        <span class="fill" aria-hidden="true"></span>
        <span class="btnlabel">LinkedIn<span class="sr"> (opens in a new tab)</span></span>
      </a>

      <a class="btn btn--email reveal" style="--d:5" href="mailto:connect.jessboyd@gmail.com">
        <span class="fill" aria-hidden="true"></span>
        <span class="btnnote btnnote--right" aria-hidden="true"><span class="script" data-draw>Say hi!</span></span>
        <img class="cstar cstar--d" src="../assets/img/star.png" alt="" aria-hidden="true">
        <span class="btnlabel">Email Me</span>
      </a>
    </nav>

    <!-- SIGN-OFF — the same dog that peeks up on the homepage hero, perched here on the pink strip's edge -->
    <div class="footrow reveal" style="--d:6">
      <div class="peek" aria-hidden="true"><div class="peekclip"><div class="peekin" id="linksDog">
        <img src="../assets/img/dog-peek.png" width="1000" height="980" class="dogbody" alt="">
        <img src="../assets/img/dog-peek.png" width="1000" height="980" class="dogtail" alt="">
      </div></div></div>
      <p class="script thanks" data-draw>Thanks for stopping by!</p>
    </div>
    <div class="bottomstrip" aria-hidden="true"></div>
  </main>
</div>

<!-- core.js needs js/data/pencil.js loaded first even though this page doesn't draw with the pencil (it reads pencil sizing on setup) -->
<script src="../js/data/pencil.js"></script>
<script src="../js/core.js"></script>
<script src="../js/effects.js"></script>
<script src="../js/links.js"></script>
</body>
</html>
